<section class="login">
  <h2>Login / Cadastro</h2>
  <form (ngSubmit)="login()" class="login-form">
    <div class="input-group">
      <input
        type="email"
        required
        [(ngModel)]="email"
        name="email"
        placeholder="Email">
    </div>
    <div class="input-group">
      <input
        type="password"
        required
        [(ngModel)]="senha"
        name="senha"
        placeholder="Senha">
    </div>
    <div class="lgpd-checkbox">
      <input
        type="checkbox"
        id="lgpd"
        [(ngModel)]="lgpdAceito"
        name="lgpd"
        required>
      <label for="lgpd">Li e aceito os termos da LGPD</label>
    </div>
    <div *ngIf="warnLgpd" class="warn-lgpd">
      É necessário aceitar os termos da LGPD!
    </div>
    <button type="submit" class="btn-primary">Entrar</button>
  </form>
  <div *ngIf="mensagem" class="mensagem">{{ mensagem }}</div>
</section>
